name: Actualizar revista FORMA
on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener revista
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar edición
        run: python scripts/actualizar.py
      - name: Guardar la edición
        run: |
          if ! git diff --quiet -- data/ediciones.json; then
            git config user.name 'FORMA Bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/ediciones.json
            git commit -m 'Actualización semanal FORMA'
            git push
          fi
